<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — HAWA DENNIS</title>
  <link rel="stylesheet" href="forgot-password.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; }
    .auth-container { width: 100%; max-width: 500px; }
    .auth-header { text-align: center; margin-bottom: 36px; color: #fff; }
    .auth-header h1 { font-size: 32px; margin-bottom: 8px; font-weight: 700; }
    .auth-header p { font-size: 16px; opacity: 0.9; }
    .auth-card { background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .auth-card h2 { font-size: 24px; margin-bottom: 8px; color: #222; font-weight: 700; }
    .auth-card-sub { font-size: 13px; color: #666; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="email"],input[type="password"],input[type="text"] { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid #ddd; font-size: 14px; transition: all 0.2s; }
    input[type="email"]:focus,input[type="password"]:focus,input[type="text"]:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .form-actions { display: flex; gap: 12px; margin-top: 20px; }
    button { padding: 12px 24px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button[type="submit"] { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; flex: 1; }
    button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4); }
    button[type="submit"]:active { transform: translateY(0); }
    #msg { margin: 16px 0; padding: 12px 14px; border-radius: 8px; font-size: 13px; min-height: 20px; }
    #msg:empty { display: none; }
    #msg.error { background: #fee; color: #c33; border: 1px solid #fcc; }
    #msg.success { background: #efe; color: #3c3; border: 1px solid #cfc; }
    .back-link { display: inline-block; margin-top: 16px; color: #667eea; text-decoration: none; font-size: 13px; font-weight: 600; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>HAWA <span style="color: #ffc107;">DENNIS</span></h1>
      <p>Reset your password</p>
    </div>

    <div id="msg"></div>

    <div class="auth-card">
      <div id="step1">
        <h2>Forgot password?</h2>
        <p class="auth-card-sub">Enter your email to receive a reset link</p>
        <form id="request-form">
          <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" required placeholder="you@email.com" />
          </div>
          <div class="form-actions">
            <button type="submit">Send reset link</button>
          </div>
        </form>
      </div>

      <div id="step2" style="display:none;">
        <h2>Reset password</h2>
        <p class="auth-card-sub">Enter your reset code and new password</p>
        <form id="reset-form">
          <div class="form-group">
            <label for="token">Reset code</label>
            <input id="token" type="text" required placeholder="Paste the code from your email" />
          </div>
          <div class="form-group">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" required placeholder="••••••••" />
          </div>
          <div class="form-actions">
            <button type="submit">Reset password</button>
          </div>
        </form>
      </div>

      <a href="user-auth.html" class="back-link">← Back to sign in</a>
    </div>
  </div>

<script type="module" src="firebase-auth.js"></script>
<script type="module" src="firebase-db.js"></script>
<script src="script.js"></script>
  <script type="module">
    import { firebaseAuth } from './firebase-auth.js';

    (function(){
      const msg = document.getElementById('msg');
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');

      function show(m, type = 'error'){
        if(msg) {
          msg.textContent = m;
          msg.className = type;
        }
      }

      // Step 1: request password reset email
      document.getElementById('request-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        try {
          show('Sending reset link...', 'success');
          await firebaseAuth.sendPasswordReset(email);
          show('✓ Reset link sent! Check your email for instructions to reset your password.', 'success');
          // Hide the form and show a confirmation note
          step1.style.display = 'none';
          step2.style.display = 'block';
          document.querySelector('#step2 .auth-card-sub').textContent =
            'We sent a password reset link to your email. Click the link in the email to choose a new password.';
          document.querySelector('#step2 form').style.display = 'none';
        } catch (err) {
          show('✗ Error: ' + (err && err.message ? err.message : err), 'error');
        }
      });

      // Step 2 (Firebase handles the actual reset via the emailed link).
      // This form is intentionally not used for direct resets; Firebase shows
      // a dedicated reset page after the user clicks the emailed link.
      document.getElementById('reset-form').addEventListener('submit', (e) => {
        e.preventDefault();
        show('Firebase sends the password reset link via email. Please use the link from your inbox.', 'success');
      });
    })();
  </script>
</body>
</html>
